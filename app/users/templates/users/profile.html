{% extends "base.html" %}

{% block title %}Профіль{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="p-3 mb-2 bg-primary text-white rounded d-flex align-items-center">
        <h3 class="mb-0">
            Ласкаво просимо до сторінки
            <i class="bi bi-people-fill mx-2"></i>
            {{ username }}!
        </h3>
    </div>

    <p class="text-muted mt-3">Тут ви можете отримати інформацію та вийти з системи.</p>

    <form action="{{ url_for('users.logout') }}" method="POST">
        <button type="submit" class="btn btn-danger">Вийти</button>
    </form>
</div>
{% endblock %}
